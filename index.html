<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--viewport : 의미 브라우저가 웹페이지를 보여주는 화면 영역 -->
    <!--width=device-width → 웹페이지 너비를 현재 기기의 화면 너비에 맞춤-->
    <!--initial-scale=1.0 → 처음 화면을 확대/축소하지 않고 100% 크기로 표시-->
    <title>OSS 수업 학생 정보</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body  class="d-flex flex-column min-vh-100">

    <header class="bg-dark text-white py-3">

        <div class="container">

            <div class="d-flex justify-content-between align-items-center">

                <div>
                    <h1>OSS Student Management</h1>

                    <p class="text-white-50 mb-0">
                        Open Source Studio 수강생 관리
                    </p>
                </div>

                <!--
                text-nowrap → 학생 추가를 줄바꿈하지 않음
                flex-shrink-0 → Flexbox 안에서 버튼 폭이 강제로 줄어들지 않게 함
                -->
                <a href="add.html" class="btn btn-light text-nowrap flex-shrink-0">
                    학생 추가
                </a>

            </div>

        </div>

    </header>

    <main class="container py-5 flex-grow-1">
        <!--table-responsive : 화면이 좁아서 표가 다 안 들어가면, 표를 억지로 찌그러뜨리지 않고 가로 스크롤로 볼 수 있게 해준-->
        <div class="table-responsive">
            <!--table : Bootstrap의 기본 표 스타일을 적용 -->
            <!--table-striped : 행마다 배경색을 번갈아 적용-->
            <!--table-hover : 마우스를 특정 행 위에 올렸을 때 그 행의 배경이 살짝 바뀌어-->
            <table class="table table-striped table-hover align-middle text-center">

                <thead>
                    <tr>
                        <th>학번</th>
                        <th>이름</th>
                        <th>학부</th>
                        <th>학기</th>
                        <th>관리</th>
                    </tr>
                </thead>

                <tbody>

                    <tr>
                        <td>22300253</td>
                        <td>명수호</td>
                        <td>AI 컴퓨터 공학 심화</td>
                        <td>4</td>
                        <td>
                            <a href="view.html" class="btn btn-dark btn-sm">상세</a>
                        </td>

                    </tr>

                    <tr>
                        <td>22200532</td>
                        <td>이선진</td>
                        <td>AI 컴퓨터 공학 심화</td>
                        <td>6</td>
                        <td>
                            <a href="view.html" class="btn btn-dark btn-sm">상세</a>
                        </td>
                    </tr>

                </tbody>

            </table>
        </div>




    </main>

    <footer class="bg-dark text-white text-center py-3 mt-5">
        <div class="container">
            <p class="mb-1">OSS Student Management</p>
            <p class="text-white-50 mb-0">Open Source Studio · 2026</p>
        </div>
    </footer>

</body>

</html>
