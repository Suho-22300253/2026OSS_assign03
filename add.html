<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>학생 추가</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>


<body>

    <header class="py-3 bg-dark text-white">
        <div class="container">
            <h1 class="mb-0">학생 추가</h1>
        </div>
    </header>

    <main class="container py-5">
        <!--
        row → Bootstrap Grid의 한 줄
        
        justify-content-center → 그 안의 column을 가운데 배치

        col-12 → 작은 화면에서는 12칸 전체 사용

        col-md-8 → md 이상에서는 12칸 중 8칸

        col-lg-6 → lg 이상에서는 12칸 중 6칸
        -->

        <div class="row justify-content-center">

            
                <form> <!-- 사용자가 입력하는 여러 데이터를 하나의 입력 양식으로 묶는 태그 -->

                    <!--
                        form-label → label을 Bootstrap Form 스타일로 정리
                        form-control → input을 Bootstrap 스타일 입력창으로 만듦
                        mb-3 → 각 입력 항목 아래에 margin을 줘서 서로 붙지 않게 함
                    -->

                    <div class="py-1 mb-3">
                        <label for="studentId" class="form-label">학번</label>
                        <input type="text" id="studentId" class="form-control bg-light">
                    </div>


                    <div class="py-1 mb-3">
                        <label for="name" class="form-label">이름</label>
                        <!--for이 없으면 label과 특정 input이 명시적으로 연결되지 않음 for 가 있을 경우 학번을 클릭해도 입력창에 커서가 들어감-->
                        <input type="text" id="name" class="form-control bg-light">
                    </div>

                    <div class="py-1 mb-3">
                        <label for="department" class="form-label">학부</label>

                        <select id="department" class="form-select bg-light"> <!--Bootstrap이 제공하는 select 디자인-->
                            <option value="" selected disabled>학부를 선택하세요</option>
                            <option value="global">글로벌리더십</option>
                            <option value="language">국제어문</option>
                            <option value="business">경영경제</option>
                            <option value="law">법학부</option>
                            <option value="communication">커뮤니케이션</option>
                            <option value="counseling">상담심리사회복지</option>
                            <option value="life-science">생명과학</option>
                            <option value="spatial-environment">공간환경시스템</option>
                            <option value="ai-computer-electronics">AI컴퓨터전자</option>
                            <option value="contents-design">콘텐츠융합디자인</option>
                            <option value="mechanical-control">기계제어</option>
                            <option value="language-education">언어교육원</option>
                            <option value="creative-education">창의융합교육원</option>
                            <option value="ict">ICT창업학부</option>
                            <option value="ai-education">AI융합교육원</option>
                            <option value="ai-convergence">AI융합학부(신설)</option>
                        </select>
                    </div>

                    <div class="py-1 mb-3">
                        <label for="semester" class="form-label">학기</label>
                        <input type="number" id="semester" class="form-control  bg-light">
                    </div>

                    <div class="py-1 mb-3">
                        <label for="email" class="form-label">이메일</label>
                        <input type="email" id="email" class="form-control bg-light">
                    </div>

                    <div class="py-1 mb-3">
                        <label for="phone" class="form-label">전화번호</label>
                        <input type="tel" id="phone" class="form-control  bg-light">
                    </div>


                    <div class="d-flex justify-content-between align-items-center">

                        <button type="submit" class="btn btn btn-outline-dark">학생 추가</button>

                        <a href="index.html" class="btn btn-dark">학생 목록 보기</a>
                        <!--btn에 기본적으로 hover가 들어가 있어 마우스가 위로 올라가면 색깔이 바뀜-->
                        <!--div는 block으로 -->

                    </div>

                </form>
            </div>
        </div>

    </main>

</body>

</html>
